<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Details</title>
</head>
<body>
    <h2>Kindly fill the Details </h2>
    <form>
        <label for="username">Username</label>
        <input type="text" 
        id="username"
        name="username"
        placeholder="Enter your name"
        required/>
        <br> <br>
        <label for="password">Password</label>
         <input type="password" 
         minlength="6"
         maxlength="9"
         id="password" 
         name="type your password"
         required/>
         <br> <br> 
         <input type="submit"> 
    </form>
</body>
</html>
